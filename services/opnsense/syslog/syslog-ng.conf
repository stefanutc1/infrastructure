# OPNsense Syslog-ng Remote Logging Configuration
# Forwarding Target: Wazuh SIEM / XDR Manager (192.168.1.240:514 UDP)
# Scope: Full Network Traffic (filterlog), Suricata IDS, Zenarmor, and System Telemetry
# Compliance: PCI-DSS 10.6, ISO 27001 A.12.4.1, NIS2 Centralized Logging Audit

destination d_wazuhsiem {
    network(
        "192.168.1.240"
        transport("udp")
        port(514)
        ip-protocol(4)
        persist-name("wazuhsiem")
    );
};

log {
    source(s_all);
    destination(d_wazuhsiem);
};
