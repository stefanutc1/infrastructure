groups:
  - name: homelab-rack-hardware-alerts
    rules:
      - alert: RackIntakeTemperatureHigh
        expr: node_rack_temperature_celsius > 32.0
        for: 2m
        labels:
          severity: warning
          category: environmental
        annotations:
          summary: "Homelab Rack Intake Temperature High (>32C)"
          description: "Rack intake ambient temperature is currently {{ $value }}C."

      - alert: RackDcBusVoltageDegraded
        expr: node_rack_dc_bus_volts < 11.4 or node_rack_dc_bus_volts > 12.8
        for: 1m
        labels:
          severity: critical
          category: power
        annotations:
          summary: "Rack DC 12V Bus Voltage Out of Bounds"
          description: "DC Bus voltage is fluctuating at {{ $value }}V."

      - alert: RackI2CBusLockupFrequent
        expr: rate(node_rack_i2c_bus_recovery_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
          category: hardware
        annotations:
          summary: "Frequent Hardware I2C Bus Recoveries Detected"
          description: "The hardware I2C bus recovery triggered multiple times in the last 5 minutes."
