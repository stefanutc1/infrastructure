name: netbox

services:
  netbox:
    image: netboxcommunity/netbox:v4.1-latest
    container_name: netbox
    depends_on:
      - postgres
      - redis
      - redis-cache
    env_file:
      - .env
    ports:
      - "8000:8080"
    volumes:
      - ./config/media:/opt/netbox/netbox/media
      - ./config/reports:/opt/netbox/netbox/reports
      - ./config/scripts:/opt/netbox/netbox/scripts
    restart: unless-stopped

  netbox-worker:
    image: netboxcommunity/netbox:v4.1-latest
    container_name: netbox-worker
    depends_on:
      - netbox
    env_file:
      - .env
    command:
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - rqworker
    volumes:
      - ./config/media:/opt/netbox/netbox/media
      - ./config/reports:/opt/netbox/netbox/reports
      - ./config/scripts:/opt/netbox/netbox/scripts
    restart: unless-stopped

  netbox-housekeeping:
    image: netboxcommunity/netbox:v4.1-latest
    container_name: netbox-housekeeping
    depends_on:
      - netbox
    env_file:
      - .env
    command:
      - /opt/netbox/housekeeping.sh
    restart: unless-stopped

  postgres:
    image: docker.io/postgres:16-alpine
    container_name: netbox-postgres
    env_file:
      - .env
    volumes:
      - ./config/pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: docker.io/redis:7-alpine
    container_name: netbox-redis
    command:
      - sh
      - -c
      - redis-server --appendonly yes --requirepass $$REDIS_PASSWORD
    env_file:
      - .env
    volumes:
      - ./config/redis:/data
    restart: unless-stopped

  redis-cache:
    image: docker.io/redis:7-alpine
    container_name: netbox-redis-cache
    command:
      - sh
      - -c
      - redis-server --requirepass $$REDIS_PASSWORD
    env_file:
      - .env
    restart: unless-stopped
