<div class="min-h-screen bg-theme-bg text-theme-primary font-sans flex flex-col antialiased selection:bg-slate-400/25 selection:text-slate-50">
  
  <!-- Global Top Header with RO/EN Language Switcher & Cmd+K Trigger -->
  <app-header
    (searchTriggered)="openCommandPalette()"
  ></app-header>

  <!-- Global Command Palette Modal (Cmd+K / Ctrl+K) -->
  <app-command-palette
    (nodeFocused)="onNodeSelected($event)"
  ></app-command-palette>

  <!-- MAIN EDITORIAL & ENGINEERING PRESENTATION -->
  <main class="flex-1 w-full flex flex-col">
    
    <!-- 1. Editorial Overview & Architecture Vision -->
    <div id="overview">
      <app-overview></app-overview>
    </div>

    <!-- 2. Interactive 3D Spatial Topology Section -->
    <section id="topology-section" class="w-full py-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto border-b border-obsidian-750">
      <app-topology-canvas
        [selectedNode]="selectedNode"
        [activeCategory]="activeCategory"
        [perspective]="perspective"
        (nodeSelected)="onNodeSelected($event)"
        (categoryChanged)="onCategoryChanged($event)"
        (perspectiveChanged)="onPerspectiveChanged($event)"
      ></app-topology-canvas>
    </section>

    <!-- Node Inspector Drawer (Shows when a node is clicked) -->
    <app-node-inspector
      [node]="selectedNode"
      (close)="onNodeSelected(null)"
      (selectConnected)="onNodeSelected($event)"
    ></app-node-inspector>

    <!-- 3. Physical Hardware Fleet -->
    <div class="border-b border-obsidian-750">
      <app-hardware-fleet
        (nodeFocused)="onNodeSelected($event)"
      ></app-hardware-fleet>
    </div>

    <!-- 4. Active Services & Workloads Catalog (26 Workloads) -->
    <div class="border-b border-obsidian-750">
      <app-service-matrix
        (nodeFocused)="onNodeSelected($event)"
      ></app-service-matrix>
    </div>

    <!-- 5. Network Architecture & VLAN Isolation -->
    <div class="border-b border-obsidian-750">
      <app-network-view></app-network-view>
    </div>

    <!-- 6. Active Directory Multi-Tier Identity Security Lab -->
    <div class="border-b border-obsidian-750">
      <app-active-directory></app-active-directory>
    </div>

    <!-- 7. Bachelor's Thesis: Banking Systems Architecture & Security -->
    <div class="border-b border-obsidian-750">
      <app-bachelor-thesis></app-bachelor-thesis>
    </div>

    <!-- 8. Real-World Cyber Forensics & Threat Deconstruction Cases (5 Cases) -->
    <div class="border-b border-obsidian-750">
      <app-cyber-cases></app-cyber-cases>
    </div>

    <!-- 9. Declarative IaC Lifecycle & 6 CI/CD Security Gates -->
    <div class="border-b border-obsidian-750">
      <app-iac-cicd></app-iac-cicd>
    </div>

    <!-- 10. Real Infrastructure Photo Gallery & Portfolio About Me -->
    <div class="border-b border-obsidian-750">
      <app-about-gallery></app-about-gallery>
    </div>

    <!-- 11. Engineering Blueprint, Storage Pools & Technical Specs -->
    <app-architecture-blueprint></app-architecture-blueprint>

  </main>

  <!-- Technical Presentation Footer -->
  <footer class="w-full py-12 px-4 sm:px-6 lg:px-8 border-t border-obsidian-750 bg-[#08090b] font-sans text-xs text-slate-400">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2.5 text-slate-300 font-sans">
        <span class="w-2 h-2 rounded-full bg-slate-400"></span>
        <span class="font-bold text-sm text-slate-100">Infrastructure</span>
        <span class="text-slate-400 text-xs">— Architecture & Workloads</span>
        <span class="text-slate-500 text-xs hidden md:inline">{{ ts.t.footerSub }}</span>
      </div>
      <div class="flex items-center gap-6 font-sans text-xs">
        <a href="#overview" class="hover:text-slate-50 transition-colors">{{ ts.t.footerTop }}</a>
        <a href="https://github.com/stefanutc1/infrastructure" target="_blank" rel="noopener noreferrer" class="hover:text-slate-300 transition-colors underline">{{ ts.t.footerGithub }}</a>
      </div>
    </div>
  </footer>

</div>
