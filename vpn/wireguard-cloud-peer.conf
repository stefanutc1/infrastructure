# ==============================================================================
# Cloud-Side Peer Configuration (AWS EC2 / GCP GCE / Hetzner / DigitalOcean)
# Hybrid Interconnect to Datacenter On-Premise Gateway
# Managed by Antigravity IaC
#
# Deployment on Cloud Linux:
#   sudo apt install -y wireguard wireguard-tools
#   sudo cp wireguard-cloud-peer.conf /etc/wireguard/wg-datacenter.conf
#   sudo systemctl enable --now wg-quick@wg-datacenter
# ==============================================================================

[Interface]
# Cloud Peer Transit IPv4
Address = 10.50.0.2/30
PrivateKey = 8KIXKXfvt3zacidlphxDx/3J55H+kJ+ktKML2S40YFU=
MTU = 1420

# Optional NAT masquerading for Cloud VPC routed subnets
# PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
# PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

# Datacenter On-Premise Gateway Peer
[Peer]
PublicKey = ZTuOPIZWTggK5k/SlEGoMA5hJb1SpZeFxl4omvL15xk=
PresharedKey = 5RX/uq5UUeR0eeLXBhwZGA/1JHKyYgKM/m1yaArPQSU=
Endpoint = 86.120.190.131:51820

# Routed subnets reachable inside Datacenter
# 10.50.0.1/32  -> Datacenter Gateway Transit IP
# 192.168.1.0/24 -> Node 1 & Management / DMZ
# 10.10.10.0/24 -> Datacenter Production Services (Nextcloud, Vaultwarden, etc.)
# 10.10.20.0/30 -> Inter-Firewall Transit Network (OPNsense <-> FortiGate)
AllowedIPs = 10.50.0.1/32, 192.168.1.0/24, 10.10.10.0/24, 10.10.20.0/30

# Keepalive ensures NAT pinholes remain permanently open
PersistentKeepalive = 25
